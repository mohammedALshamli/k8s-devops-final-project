---
- hosts: k8s_cluster
  become: true
  tasks:
    - name: Update DNF cache and upgrade all packages
      dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Install admin tools
      dnf:
        name:
          - nano
          - vim
          - git
          - curl
          - wget
          - bash-completion
          - tar
          - tmux
          - dnf-utils
        state: present

    - name: Install networking/troubleshooting tools
      dnf:
        name:
          - iproute
          - net-tools
          - bind-utils
          - traceroute
          - tcpdump
          - lsof
          - sysstat
        state: present

    - name: Install python3 and pip
      dnf:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install chrony
      dnf:
        name: chrony
        state: present

    - name: Enable and start chronyd
      service:
        name: chronyd
        state: started
        enabled: true

    - name: Enable and start sshd
      service:
        name: sshd
        state: started
        enabled: true

    - name: Gather system facts
      debug:
        msg: >
          Host: {{ ansible_hostname }} |
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }} |
          Kernel: {{ ansible_kernel }} |
          vCPU: {{ ansible_processor_vcpus }} |
          RAM: {{ ansible_memtotal_mb }}MB

    - name: Check if a reboot is needed
      command: needs-restarting -r
      register: reboot_check
      failed_when: false
      changed_when: false

    - name: Reboot w1 only if needed (never reboot cp1)
      reboot:
        reboot_timeout: 300
      when: reboot_check.rc == 1 and inventory_hostname == 'w1'
