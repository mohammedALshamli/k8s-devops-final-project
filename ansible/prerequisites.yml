---
- hosts: k8s_cluster
  become: true
  tasks:
    - name: Check current swap status
      command: swapon --show
      register: swap_status
      changed_when: false

    - name: Disable swap immediately
      command: swapoff -a
      when: swap_status.stdout != ""
      changed_when: swap_status.stdout != ""

    - name: Remove swap entries from /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Set SELinux to permissive (runtime)
      command: setenforce 0
      changed_when: true
      failed_when: false

    - name: Set SELinux to permissive (persistent)
      replace:
        path: /etc/selinux/config
        regexp: '^SELINUX=enforcing'
        replace: 'SELINUX=permissive'

    - name: Check if overlay module is loaded
      command: lsmod
      register: lsmod_overlay
      changed_when: false

    - name: Load overlay kernel module now
      command: modprobe overlay
      when: "'overlay' not in lsmod_overlay.stdout"
      changed_when: "'overlay' not in lsmod_overlay.stdout"

    - name: Check if br_netfilter module is loaded
      command: lsmod
      register: lsmod_br_netfilter
      changed_when: false

    - name: Load br_netfilter kernel module now
      command: modprobe br_netfilter
      when: "'br_netfilter' not in lsmod_br_netfilter.stdout"
      changed_when: "'br_netfilter' not in lsmod_br_netfilter.stdout"

    - name: Persist kernel modules on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Persist sysctl bridge parameters
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward = 1

    - name: Apply sysctl parameters now
      command: sysctl --system
      changed_when: true
