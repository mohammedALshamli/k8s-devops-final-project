services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./app
      args:
        APP_VERSION: "1.0.0"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://taskuser:taskpass@db:5432/taskdb
    ports:
      - "5050:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
